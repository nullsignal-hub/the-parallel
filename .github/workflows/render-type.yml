name: render-type

# LAB product: a cell-TYPE poster for a lab (every neuron of one MaleCNS
# type, overlaid). Triggered by the checkout Worker right after payment
# (product "lab"). Renders portrait-render/type_poster.py at print size,
# publishes the PNG under a random name, and places a DRAFT Printful order --
# the seller still clicks "Confirm" in the Printful dashboard (same safety
# policy as render-neuron.yml).
#
# Printful external_id is "lab-<order_id>" (Printful caps it at 32 chars);
# the long reference "lab-<type>-<style>-<size>-<order_id>" goes to Discord.
# The Worker keys its KV order record by the same "lab-<order_id>" so the
# package_shipped webhook finds it.
#
# Variants (Enhanced Matte Paper Poster (in), checked via Printful catalog
# API 2026-09-26): 18x24 -> 1, 24x36 -> 2 (portrait-render/printful_draft.py).
on:
  workflow_dispatch:
    inputs:
      type:
        description: "MaleCNS cell type, must be in portrait-render/types-index.json"
        required: true
      style:
        description: "ink | spectral | blueprint | duotone | constellation"
        required: true
      size:
        description: "18x24 | 24x36 (inches; the sheet is turned to match the subject)"
        required: true
      caption:
        description: "optional, max 60 chars, Latin/Greek printable only"
        required: false
        default: ""
      order_id:
        description: "PayPal order id (uniqueness key for the Printful order)"
        required: true
      recipient_b64:
        description: "base64 JSON: {name,address1,address2,city,state_code,country_code,zip,email}"
        required: true

permissions:
  contents: write

jobs:
  render-and-order:
    runs-on: ubuntu-latest
    env:
      # Inputs go through env, never straight into shell text.
      TYPE: ${{ github.event.inputs.type }}
      STYLE: ${{ github.event.inputs.style }}
      SIZE: ${{ github.event.inputs.size }}
      CAPTION: ${{ github.event.inputs.caption }}
      ORDER_ID: ${{ github.event.inputs.order_id }}
      PRODUCT: lab
      # Print resolution per sheet (measured, see IMPLEMENTATION-LOG-lab-backend.md).
      DPI_18x24: "200"
      DPI_24x36: "200"
    steps:
      - uses: actions/checkout@v4

      # stdlib-only (runs on the runner's python3 before setup-python), so a
      # bad input still ends in the @everyone alert below.
      - name: Validate inputs
        id: validate
        run: |
          set -eu
          # 25 max: same bound as render-neuron.yml; "lab-" + 25 << Printful's 32.
          echo "$ORDER_ID" | grep -Eq '^[A-Za-z0-9-]{1,25}$' || { echo "bad order_id" >&2; exit 1; }
          python3 portrait-render/lab_inputs.py "--type=$TYPE" "--style=$STYLE" \
            "--size=$SIZE" "--caption=$CAPTION" > /tmp/lab-input.json
          cat /tmp/lab-input.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r portrait-render/requirements.txt

      - name: Render type poster
        id: render
        working-directory: portrait-render
        run: |
          set -euo pipefail
          mkdir -p out
          case "$SIZE" in 18x24) DPI="$DPI_18x24";; 24x36) DPI="$DPI_24x36";; *) exit 1;; esac
          python type_poster.py "--type=$TYPE" "--style=$STYLE" "--size=$SIZE" \
            "--caption=$CAPTION" "--dpi=$DPI" --out out/type.png | tee out/render.json
          DPI="$DPI" python - <<'PYEOF'
          import json, os
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          r = json.loads(open("out/render.json").read().strip().splitlines()[-1])
          dpi = int(os.environ["DPI"])
          w, h = (float(x) for x in r["paper_in"].split("x"))
          want = (round(w * dpi), round(h * dpi))
          got = Image.open("out/type.png").size
          assert got == want, "size %s != %s" % (got, want)
          assert sorted(want) == sorted(round(float(x) * dpi) for x in os.environ["SIZE"].split("x"))
          assert r["n_drawn"] >= 1
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("paper=%s\n" % r["paper_in"])
              fh.write("n_drawn=%d\n" % r["n_drawn"])
              fh.write("n_type=%d\n" % r["n_type"])
          PYEOF

      - name: Publish with a random (non-guessable) filename
        id: publish
        run: |
          set -eu
          TOKEN=$(python -c "import secrets; print(secrets.token_hex(12))")
          DEST="connectome-art-prints/pt-$TOKEN.png"
          mv portrait-render/out/type.png "$DEST"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"
          echo "url=https://raw.githubusercontent.com/${{ github.repository }}/main/$DEST" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          set -eu
          git config user.name "type-render bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.publish.outputs.dest }}"
          git commit -m "Render LAB type poster $TYPE ($STYLE, $SIZE) for order $ORDER_ID"
          # Two purchases close together both push to main: rebase and retry.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $((i * 3))
            git pull --rebase
          done
          echo "push failed after retries" >&2
          exit 1

      - name: Wait for raw.githubusercontent.com to serve the file
        run: |
          URL="${{ steps.publish.outputs.url }}"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then echo "ready after $i tries"; exit 0; fi
            sleep 3
          done
          echo "file never became reachable at $URL" >&2
          exit 1

      - name: Create draft Printful order
        id: printful
        working-directory: portrait-render
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          RECIPIENT_B64: ${{ github.event.inputs.recipient_b64 }}
          FILE_URL: ${{ steps.publish.outputs.url }}
          CELL_TYPE: ${{ github.event.inputs.type }}
        run: python printful_draft.py

      - name: Notify Discord (success)
        if: success()
        working-directory: portrait-render
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          URGENT: "0"
          TITLE: "New paid LAB order - draft ready to confirm: ${{ github.event.inputs.type }} (${{ github.event.inputs.style }}, ${{ github.event.inputs.size }})"
          DRAFT_ID: ${{ steps.printful.outputs.draft_id }}
          CELL_TYPE: ${{ github.event.inputs.type }}
          PAPER: ${{ steps.render.outputs.paper }}
          FILE_URL: ${{ steps.publish.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEXT: "Printful画面で下書き(ポスター寸法・キャプション)を確認して Confirm を押してください"
        run: python notify_discord.py

      # Runs if ANY earlier step failed (including validation), so a paid
      # order never silently falls through. stdlib only.
      - name: Notify Discord (FAILED, @everyone)
        if: failure()
        working-directory: portrait-render
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          URGENT: "1"
          TITLE: "PAID LAB ORDER NOT AUTO-FULFILLED: ${{ github.event.inputs.type }} (${{ github.event.inputs.style }}, ${{ github.event.inputs.size }})"
          DRAFT_ID: ${{ steps.printful.outputs.draft_id }}
          CELL_TYPE: ${{ github.event.inputs.type }}
          PAPER: ${{ steps.render.outputs.paper }}
          FILE_URL: ${{ steps.publish.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEXT: "validate=${{ steps.validate.outcome }} render=${{ steps.render.outcome }} publish=${{ steps.publish.outcome }} printful=${{ steps.printful.outcome }} / Runのログを確認し、手動で描画とPrintful発注をしてください"
        run: python3 notify_discord.py
